aid: nocd
name: NOCD
description: 'NOCD is a virtual mental-health provider specializing in the treatment
  of obsessive-compulsive disorder. Through its web and mobile applications the company
  matches members with licensed therapists trained in Exposure and Response Prevention
  (ERP) therapy, delivers live video sessions, and provides between-session messaging,
  a peer community, and in-app therapeutic tools. NOCD is in-network with a large number
  of US health plans and serves children, adolescents, and adults. The product is delivered
  as an end-user clinical service — the company operates a private mobile/web application
  backend at api.treatmyocd.com but publishes no public developer program, API reference,
  or machine-readable specification.'
